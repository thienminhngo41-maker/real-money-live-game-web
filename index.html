<style>
:root{--top:58px;--bottom:62px;--gold:#d4af37;--bg:#090909;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}body{padding-top:calc(var(--top) + var(--safe-top));padding-bottom:calc(var(--bottom) + var(--safe-bottom));user-select:none;-webkit-user-select:none}::-webkit-scrollbar{display:none}
.topbar{position:fixed;top:var(--safe-top);left:0;right:0;height:var(--top);z-index:100;background:#090909;border-bottom:1px solid #262626;display:flex;align-items:center;padding:5px 10px;gap:7px}.user{display:flex;align-items:center;min-width:0;flex:1;gap:7px}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);background:#222}.user-meta{min-width:0;line-height:1.05}.name{font-size:12px;font-weight:800;max-width:108px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uid{font-size:8px;color:#c9a93d;margin-top:3px;font-family:monospace;white-space:nowrap}.balance{display:flex;align-items:baseline;gap:3px;white-space:nowrap;margin-left:auto;padding-right:1px}.balance-label{font-size:8px;color:#888}.balance-value{font-size:13px;font-weight:900;color:#fff}.balance-unit{font-size:8px;color:#999}.action{height:38px;min-width:48px;padding:0 8px;border-radius:10px;background:#151515;border:1px solid #292929;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:9px;line-height:1.05}.action .ico{font-size:15px;margin-bottom:1px}.action:active{background:#222;transform:scale(.97)}
main{padding:9px 10px 14px;max-width:520px;margin:auto}.page{display:none}.page.active{display:block;animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{position:relative;height:168px;border:1px solid #4d3d12;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 75% 35%,#513b18 0,#171717 38%,#0b0b0b 78%);box-shadow:0 3px 12px #000;margin-bottom:9px}.hero-copy{position:absolute;left:16px;top:25px;z-index:2}.hero h1{font-size:25px;line-height:1.05;margin:0 0 8px;font-weight:900;letter-spacing:-1px}.hero p{font-size:9px;color:#b7a06b;line-height:1.5;margin:0;max-width:150px}.hero-btn{margin-top:12px;width:43px;height:28px;border-radius:999px;background:linear-gradient(#f7d66d,#d39c27);color:#111;font-weight:900;border:0}.hero-art{position:absolute;right:-8px;bottom:-18px;width:58%;height:92%;background:radial-gradient(ellipse at 50% 25%,rgba(255,222,133,.28),transparent 55%);border-radius:50%;opacity:.9}.hero-art:after{content:'♛';position:absolute;top:0;left:42%;font-size:42px;color:#e9d58d;text-shadow:0 0 8px #000}
.section{margin-bottom:9px;border:1px solid #3d3215;border-radius:15px;background:#121212;overflow:hidden}.section-head{height:38px;padding:0 12px;display:flex;align-items:center;justify-content:space-between}.section-title{font-size:13px;font-weight:900}.more{font-size:18px;color:#777}.game-row{display:flex;gap:8px;overflow-x:auto;padding:0 9px 10px}.game-tile{flex:0 0 82px;height:82px;border-radius:12px;overflow:hidden;border:1px solid #332a13;background:#1b1b1b}.game-tile img{width:100%;height:100%;object-fit:cover}.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 9px 9px}.provider{height:112px;border-radius:14px;border:1px solid #3d3215;background:#0e0e0e;overflow:hidden;position:relative}.provider img{width:100%;height:100%;object-fit:cover}.provider .label{position:absolute;left:10px;top:9px;font-size:10px;font-weight:800;color:#d9d9d9;text-shadow:0 1px 3px #000}.feature{height:116px;border-radius:14px;overflow:hidden;position:relative;margin:0 9px 9px;border:1px solid #3d3215;background:linear-gradient(90deg,#171717,#0d0d0d)}.feature img{position:absolute;right:0;top:0;width:68%;height:100%;object-fit:cover;object-position:left center}.feature-title{position:absolute;left:12px;top:14px;font-size:14px;font-weight:900;z-index:2}.feature-sub{position:absolute;left:12px;top:40px;font-size:9px;color:#b9a56e;z-index:2}.empty{height:112px;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px}
.live-card{aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--gold);background:#000;margin-bottom:9px;position:relative}.live-card iframe{width:100%;height:100%;border:0;pointer-events:none}.live-overlay{position:absolute;inset:0}.page-title{font-size:17px;font-weight:900;margin:4px 2px 10px;color:var(--gold)}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini-card{aspect-ratio:1;border-radius:14px;border:1px solid #493a12;overflow:hidden;background:#151515}.mini-card img{width:100%;height:100%;object-fit:cover}
.profile-panel{border:1px solid #352c17;background:#121212;border-radius:15px;padding:14px;margin-bottom:9px}.profile-big{display:flex;align-items:center;gap:10px}.avatar-big{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}.profile-big-name{font-size:17px;font-weight:900}.profile-big-id{font-size:9px;color:#999;margin-top:4px}.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #252525;font-size:12px}.info-row:last-child{border-bottom:0}.info-value{color:var(--gold);font-weight:800}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.profile-action{height:44px;border-radius:10px;background:#181818;border:1px solid #3b321c;color:var(--gold);font-weight:800;font-size:11px}.profile-action:active{transform:scale(.98)}
.bottom{position:fixed;left:0;right:0;bottom:0;height:var(--bottom);padding-bottom:var(--safe-bottom);z-index:110;background:#111;border-top:1px solid #292929;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#777;font-size:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav .navico{font-size:19px;line-height:1}.nav.active{color:var(--gold)}.nav:active{background:#191919}
.popup{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px}.popup.show{display:flex}.popup-box{width:100%;max-width:320px;border-radius:16px;background:#121212;border:1px solid var(--gold);padding:18px;text-align:center;box-shadow:0 10px 30px #000}.popup-title{font-size:15px;font-weight:900;color:var(--gold);margin-bottom:8px}.popup-text{font-size:11px;color:#bbb;line-height:1.6;margin-bottom:15px}.popup-btn{width:100%;height:43px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:900}
@media(max-width:360px){:root{--top:55px}.avatar{width:33px;height:33px;flex-basis:33px}.name{max-width:85px}.action{min-width:43px;padding:0 6px}.hero{height:154px}.hero h1{font-size:22px}.game-tile{flex-basis:76px;height:76px}}
</style>

<body>

<div id="popup" class="popup" onclick="if(event.target===this)closePopup()"><div class="popup-box"><div id="popup-title" class="popup-title">준비중</div><div id="popup-text" class="popup-text">현재 테스트 버전에서는 해당 기능을 사용할 수 없습니다.</div><button id="popup-btn" class="popup-btn" onclick="closePopup()">확인</button></div></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#090909');if(tg.setBackgroundColor)tg.setBackgroundColor('#090909');
const i18n={ko:{balance:'잔액',point:'P',deposit:'충전',withdraw:'출금',hero:'라이브 카지노',heroSub:'전문 딜러, 실제 카지노 환영,\n다양한 게임 플레이 경험',popular:'인기 게임',feature:'클래식 미니게임',featureSub:'최고의 게임을 빠르게 즐겨보세요',home:'홈',live:'라이브게임',mini:'미니게임',profile:'내정보',profileTitle:'내 정보',currentBalance:'현재 잔액',history:'거래내역',gameHistory:'게임 기록',support:'고객센터',language:'언어 설정',popupTitle:'준비중',popupText:'현재 테스트 버전에서는 해당 기능을 사용할 수 없습니다.',confirm:'확인',languageName:'한국어'},cn:{balance:'余额',point:'P',deposit:'充值',withdraw:'提现',hero:'真人赌场',heroSub:'专业荷官，真实赌场体验，\n多种游戏等你体验',popular:'热门游戏',feature:'经典小游戏',featureSub:'快速体验精选游戏',home:'首页',live:'真人游戏',mini:'小游戏',profile:'我的',profileTitle:'个人信息',currentBalance:'当前余额',history:'交易记录',gameHistory:'游戏记录',support:'客服中心',language:'语言设置',popupTitle:'敬请期待',popupText:'当前测试版本尚未开放此功能。',confirm:'确认',languageName:'中文'},en:{balance:'Balance',point:'P',deposit:'Deposit',withdraw:'Withdraw',hero:'LIVE CASINO',heroSub:'Professional dealers and a real casino\nstyle game experience',popular:'Popular Games',feature:'Classic Mini Games',featureSub:'Enjoy selected games instantly',home:'Home',live:'Live Game',mini:'Mini Games',profile:'Profile',profileTitle:'My Profile',currentBalance:'Current Balance',history:'Transactions',gameHistory:'Game History',support:'Support',language:'Language',popupTitle:'Coming Soon',popupText:'This feature is not available in the current test version.',confirm:'OK',languageName:'English'}};
let currentLang='en',pageHistory=['home'];
function setupUser(){const u=tg.initDataUnsafe?.user;const photo=u?.photo_url||'';const name=u?.first_name||'VIP Guest';const id=u?.id||'777888999';document.querySelectorAll('#user-name,#profile-name-big').forEach(e=>e.textContent=name);document.querySelectorAll('#user-id,#profile-id-big').forEach(e=>e.textContent=id);document.getElementById('user-photo').src=photo;document.getElementById('profile-photo-big').src=photo;}
function detectLang(){const code=tg.initDataUnsafe?.user?.language_code||navigator.language||'en';if(code.startsWith('ko'))return'ko';if(code.startsWith('zh'))return'cn';return'en'}
function applyLang(l){currentLang=l;const d=i18n[l];const map={"balance-label":d.balance,"point-label":d.point,"deposit-label":d.deposit,"withdraw-label":d.withdraw,"hero-title":d.hero,"popular-title":d.popular,"feature-title":d.feature,"feature-sub":d.featureSub,"nav-home":d.home,"nav-live":d.live,"nav-mini":d.mini,"nav-profile":d.profile,"live-title":d.live,"mini-title":d.mini,"profile-title":d.profileTitle,"profile-balance-label":d.currentBalance,"history-label":d.history,"game-history-label":d.gameHistory,"support-label":d.support,"language-label":d.language,"profile-deposit":d.deposit,"profile-withdraw":d.withdraw,"popup-title":d.popupTitle,"popup-text":d.popupText,"popup-btn":d.confirm,"current-language":d.languageName};Object.entries(map).forEach(([id,text])=>{const el=document.getElementById(id);if(el)el.textContent=text});document.getElementById('hero-sub').innerHTML=d.heroSub.replace('\n','<br>')}
function navigate(page){const el=document.getElementById('page-'+page);if(!el)return;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));if(pageHistory[pageHistory.length-1]!==page)pageHistory.push(page);window.scrollTo(0,0);updateBack()}
function goBack(){if(pageHistory.length<=1)return;pageHistory.pop();const page=pageHistory[pageHistory.length-1];document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));window.scrollTo(0,0);updateBack()}
function updateBack(){if(pageHistory.length>1)tg.BackButton.show();else tg.BackButton.hide()}
function openAction(type){const d=i18n[currentLang];document.getElementById('popup-title').textContent=type==='deposit'?d.deposit:d.withdraw;document.getElementById('popup-text').textContent=currentLang==='ko'?'현재 테스트 버전에서는 실제 충전/출금 기능이 연결되어 있지 않습니다.':currentLang==='cn'?'当前测试版本尚未连接真实充值/提现功能。':'Real deposit and withdrawal are not connected in this test version.';document.getElementById('popup').classList.add('show');if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
function showPopup(){const d=i18n[currentLang];document.getElementById('popup-title').textContent=d.popupTitle;document.getElementById('popup-text').textContent=d.popupText;document.getElementById('popup').classList.add('show')}
function closePopup(){document.getElementById('popup').classList.remove('show')}
function showLanguagePopup(){const next=currentLang==='ko'?'cn':currentLang==='cn'?'en':'ko';applyLang(next);showPopup()}
function openCashSupport(){tg.openTelegramLink('https://t.me/asd2567')}
function openMiniGame(url){tg.openLink(url)}
setupUser();applyLang(detectLang());tg.BackButton.onClick(goBack);updateBack();
</script>
